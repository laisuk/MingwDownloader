name: CI (MSVC, windows-latest)

on:
  workflow_dispatch:

jobs:
  build-msvc:
    runs-on: windows-latest

    env:
      BUILD_TYPE: Release
      VCPKG_TRIPLET: x64-windows-static

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6

      - name: Configure (bundled MSVC SDK)
        shell: pwsh
        run: |
          cmake -S . -B build -G "Ninja" `
            -DCMAKE_BUILD_TYPE="$env:BUILD_TYPE" `
            -DVCPKG_TARGET_TRIPLET="$env:VCPKG_TRIPLET" `
            -DCMAKE_TOOLCHAIN_FILE="$env:GITHUB_WORKSPACE/vcpkg/windows-msvc/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        shell: pwsh
        run: |
          cmake --build build

      - name: Upload artifact (exe)
        uses: actions/upload-artifact@v7
        with:
          name: MingwDownloader-${{ runner.os }}-${{ env.VCPKG_TRIPLET }}
          path: |
            build/MingwDownloader.exe
            build/Release/MingwDownloader.exe
          if-no-files-found: error